weight = 600
unicodeRange = "U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF"

# ---------------------------------------------------------------- type scale
# Page title 28 px · section heading 20 px · card heading 18 px · body 15 px
# Two weights only: 400 for text, 600 for headings and figures.
[theme]
font = "Inter, sans-serif"
headingFont = "Inter, sans-serif"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["28px", "20px", "18px", "16px", "15px", "14px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontSize = "30px"
metricValueFontWeight = 600
baseRadius = "medium"
showSidebarBorder = true

# ---------------------------------------------------------------- light palette
[theme.light]
primaryColor = "#1F5FBF"              # brand / primary action (6.09:1 on white)
backgroundColor = "#FFFFFF"           # page and cards (cards = 1 px border)
secondaryBackgroundColor = "#F2F4F7"  # inputs, hover states
textColor = "#1B2430"                 # primary text (15.65:1)
borderColor = "#E3E6EB"               # card outlines, dividers
linkColor = "#1F5FBF"
blueColor = "#1F5FBF"
greenColor = "#15803D"                # positive (5.02:1)
orangeColor = "#B45309"               # attention (5.02:1)
redColor = "#B91C1C"                  # critical (6.47:1)
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.light.sidebar]
backgroundColor = "#F7F8FA"           # neutral grey sidebar frames the white page

# ---------------------------------------------------------------- dark palette
[theme.dark]
primaryColor = "#2E6FD6"              # buttons: white text 4.82:1, 3.84:1 against the page
backgroundColor = "#0F141B"
secondaryBackgroundColor = "#171D26"
textColor = "#E6EAF0"                 # 14.02:1
borderColor = "#2A323D"
linkColor = "#3987E5"                 # links: 5.08:1 on the page
blueColor = "#3987E5"
greenColor = "#4ADE80"
orangeColor = "#FBBF24"
redColor = "#F87171"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]

[theme.dark.sidebar]
backgroundColor = "#171D26"
