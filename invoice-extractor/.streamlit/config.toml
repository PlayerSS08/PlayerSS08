# Streamlit settings for Invoice Extractor: theme, fonts and behaviour.
#
# Visual identity (see the "Home Screen Visual Refresh Plan"):
#   * one brand blue for anything clickable, neutral greys everywhere else
#   * status colours (green / amber / red) reserved for meaning
#   * Inter typeface, bundled in static/fonts so it also works offline
# The app follows the viewer's system light/dark mode; it can also be
# switched from the app menu (top-right ⋮ > Settings).

[server]
maxUploadSize = 50            # MB per file
enableStaticServing = true    # serves static/ (the bundled Inter font files)

[client]
toolbarMode = "minimal"       # hide developer options such as "Deploy"

[browser]
gatherUsageStats = false

# ---------------------------------------------------------------- typeface
# Inter (SIL Open Font License, static/fonts/LICENSE-Inter.txt).
# Two files per weight: basic Latin, and Latin-extended (has the ₹ sign).
[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-400-normal.woff2"
weight = 400
unicodeRange = "U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-500-normal.woff2"
weight = 500
unicodeRange = "U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-600-normal.woff2"
weight = 600
unicodeRange = "U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-ext-400-normal.woff2"
weight = 400
unicodeRange = "U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-ext-500-normal.woff2"
weight = 500
